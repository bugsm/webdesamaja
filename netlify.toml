# Konfigurasi deploy Netlify untuk Web Desa Maja (situs Astro statik di folder majaweb/)
# Repo ini monorepo: `majaweb/` = situs publik, `studio-desa-maja/` = Sanity Studio (dideploy terpisah).

[build]
  base = "majaweb"
  command = "npm run build"
  # Catatan: saat `base` diisi, path di bawah ini tetap dihitung dari ROOT repo,
  # bukan dari `base`. Jadi harus ditulis lengkap "majaweb/...".
  publish = "majaweb/dist"

[build.environment]
  NODE_VERSION = "22"

# Serverless function (penghitung "jumlah dilihat" berita).
# Sama seperti `publish`: path dihitung dari root repo, jadi diawali "majaweb/".
[functions]
  directory = "majaweb/netlify/functions"
  node_bundler = "esbuild"

# Cache aset statik (JS/CSS/gambar ber-hash) selama 1 tahun.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Header keamanan dasar (tidak menghalangi iframe peta yang kita embed).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
